<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,200;6..72,300;6..72,400&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1200px;height:630px;overflow:hidden;}
body{background:#14143A;color:#EDECEF;font-family:"JetBrains Mono",monospace;position:relative;}
.pad{padding:56px 72px 0;}
.top{display:flex;justify-content:space-between;align-items:baseline;}
.mark{font-family:Newsreader,serif;font-weight:400;font-size:34px;letter-spacing:-.012em;color:#fff;}
.url{font-size:14px;letter-spacing:.11em;text-transform:uppercase;color:#8E8EB0;}
.tick{display:block;width:44px;height:3px;background:#F0435F;margin:60px 0 24px;}
.eyebrow{font-size:14.5px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:#B9B9D4;margin-bottom:30px;}
h1{font-family:Newsreader,serif;font-weight:200;font-size:66px;line-height:1.04;
   letter-spacing:-.032em;color:#fff;max-width:24ch;}
.band{position:absolute;left:0;right:0;bottom:0;height:158px;overflow:hidden;}
.band img{width:100%;height:100%;object-fit:cover;display:block;}
.credit{position:absolute;right:72px;bottom:18px;font-size:12px;letter-spacing:.11em;
  text-transform:uppercase;color:rgba(255,255,255,.72);text-shadow:0 1px 6px rgba(0,0,0,.6);}
</style>
</head>
<body>
  <div class="pad">
    <div class="top">
      <span class="mark">Climate Sprints</span>
      <span class="url">climatesprints.com</span>
    </div>
    <span class="tick"></span>
    <p class="eyebrow">Diligence &amp; portfolio support for capital allocating into climate</p>
    <h1>We find out if anyone has to buy it.</h1>
  </div>
  <div class="band"><img src="assets/plates/home.jpg" alt=""></div>
</body>
</html>
